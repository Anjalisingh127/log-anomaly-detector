[High Error Volume - 20 Errors in 5 Minutes]
action.ssg_mobile_alert.passSystemAuth = 1
action.webhook.enable_allowlist = 0
alert.severity = 4
alert.suppress = 0
alert.track = 1
counttype = number of events
cron_schedule = */5 * * * *
description = Triggers when at least 20 ERROR or CRITICAL events occur within a five-minute window during the most recent ten minutes.
dispatch.earliest_time = -10m@m
dispatch.latest_time = now
display.general.type = statistics
display.page.search.tab = statistics
enableSched = 1
quantity = 0
relation = greater than
request.ui_dispatch_app = search
request.ui_dispatch_view = search
search = index=app_support level IN ("ERROR","CRITICAL")\
| bin _time span=5m\
| stats count AS error_count by _time\
| where error_count >= 20

